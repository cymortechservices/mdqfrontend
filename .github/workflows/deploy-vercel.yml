name: Unpack MDQ zip

# Upload MDQ-Frontend-Redesign.zip to the repo root. This workflow unpacks it into the repo root,
# removes the zip and commits. Vercel (connected to the repo) then builds and deploys automatically.
# No secrets or repository settings needed.
on:
  push:
    branches: [main]
    paths: ["MDQ-Frontend-Redesign.zip"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract the zip into the repo root
        run: |
          test -f MDQ-Frontend-Redesign.zip
          unzip -q MDQ-Frontend-Redesign.zip -d _unzipped
          rm MDQ-Frontend-Redesign.zip
          # replace previous app files, keep .git and .github
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name _unzipped -exec rm -rf {} +
          cp -a _unzipped/MDQ-Frontend-Redesign/. .
          rm -rf _unzipped .github/workflows/deploy-vercel.yml.bak

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Deploy MDQ frontend from zip"
          git push
