name: Extract MDQ V3 ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "MDQ-V3-CINEMATIC-REDESIGN.zip"

permissions:
  contents: write

jobs:
  extract:
    # Skip the run caused by this workflow's own commit.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Make sure the ZIP exists
        run: |
          if [ ! -f MDQ-V3-CINEMATIC-REDESIGN.zip ]; then
            echo "MDQ-V3-CINEMATIC-REDESIGN.zip not found in the repo root"; exit 1
          fi

      - name: Extract ZIP
        run: |
          rm -rf /tmp/mdq && mkdir /tmp/mdq
          unzip -q MDQ-V3-CINEMATIC-REDESIGN.zip -d /tmp/mdq
          # The archive holds one top-level folder (MDQ-Frontend-Redesign/); copy its contents to the repo root.
          cp -a /tmp/mdq/MDQ-Frontend-Redesign/. .
          rm MDQ-V3-CINEMATIC-REDESIGN.zip

      - name: Commit and push extracted files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Extract MDQ V3 cinematic redesign [skip ci]"
          git push
